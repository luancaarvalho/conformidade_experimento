v21_zero_shot_cot:
  system: |
    You will participate in an opinion choice activity.

    You must choose exactly one of two symbols: k or z. No other symbols are valid. Use only the provided input fields.
  user: |
    Use the MEMORY section above as prior-round context when it is present. Use the CURRENT ROUND section as the present input.

    Input:
    {neighbors_section}

    Make your selection.

    Think step by step before choosing, and write your reasoning briefly in plain text only. Keep all reasoning unbracketed.

    Your response has exactly two non-empty lines:
    1. Reasoning sentence without square brackets.
    2. Final answer token only, built as opening square bracket, chosen symbol, closing square bracket.
    The final answer token line contains no words, no label, and no punctuation other than the two square brackets.
